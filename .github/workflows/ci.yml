name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qvP '^docs/|^\.claude/|^[^/]+\.md$|^LICENSE$|^\.gitignore$|^\.editorconfig$|^\.envrc$|^justfile$|^\.github/(?!workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Verify chippy_core invariants
        run: |
          set -e
          if grep -rn 'std\.time\.Timer\|std\.crypto\.random' src/core/; then
            echo "core invariant violation: std.time.Timer or std.crypto.random in src/core/"
            exit 1
          fi
          if grep -rn '@import.*frontend' src/core/; then
            echo "core invariant violation: src/core/ imports from src/frontend/"
            exit 1
          fi

      - name: Build
        run: nix develop -c zig build

      - name: Test
        run: nix develop -c zig build test

      - name: Format check
        run: nix develop -c zig fmt --check src/ build.zig

  required:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$TEST_RESULT" == "failure" || "$TEST_RESULT" == "cancelled" ]]; then
            exit 1
          fi
          echo "ok"
