name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qvP '^docs/|^\.claude/|^[^/]+\.md$|^LICENSE$|^\.gitignore$|^\.editorconfig$|^\.envrc$|^justfile$|^\.github/(?!workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache zig build artifacts
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-${{ matrix.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'flake.lock') }}-${{ hashFiles('src/**/*.zig') }}
          restore-keys: |
            zig-${{ matrix.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'flake.lock') }}-
            zig-${{ matrix.os }}-

      - name: Verify chippy_core invariants
        run: |
          set -e
          if grep -rn 'std\.time\.Timer\|std\.crypto\.random' src/core/; then
            echo "core invariant violation: std.time.Timer or std.crypto.random in src/core/"
            exit 1
          fi
          if grep -rn '@import.*frontend' src/core/; then
            echo "core invariant violation: src/core/ imports from src/frontend/"
            exit 1
          fi
          # Step + trace path must not allocate. Existing test scaffolding uses
          # std.testing.allocator and std.Io.Writer.Allocating, which are typed
          # against std.mem.Allocator without naming it — those don't trip the
          # grep. Naming Allocator or std.heap directly in core would.
          if grep -rn 'std\.heap\|Allocator' src/core/; then
            echo "core invariant violation: std.heap or Allocator referenced in src/core/"
            exit 1
          fi
          # Keypad's FX0A claim slot is owned by Keypad. The ADR 0013 invariant
          # ("awaiting_release is null between FX0A invocations") lives in the
          # type — only Keypad methods (pollAwaitedKey / isAwaiting / serialize
          # / deserialize) may touch the field. Zig has no field-level visibility
          # so this grep is the structural enforcement. Path-pinned (not just
          # basename) so a future second `keypad.zig` elsewhere can't bypass.
          if grep -rn 'awaiting_release' src/ | grep -v '^src/core/keypad.zig:'; then
            echo "core invariant violation: awaiting_release accessed outside src/core/keypad.zig (use Keypad.pollAwaitedKey / isAwaiting / serialize / deserialize)"
            exit 1
          fi
          # Bus RAM is owned by Bus. The 12-bit-mask invariant from CLAUDE.md
          # rule 12 lives in the type — only Bus methods (read8 / read16 /
          # write8 / loadRom / pokeSlice / peekSlice / serialize / deserialize)
          # may index the storage array. Closes the PR #60 footgun documented
          # in `docs/next-target-handoff.md` bullet 16. Path-pinned so a future
          # second `bus.zig` elsewhere can't bypass.
          if grep -rn 'bus\.ram\[' src/ | grep -v '^src/core/bus.zig:'; then
            echo "core invariant violation: bus.ram[ accessed outside src/core/bus.zig (use Bus.read8 / write8 / loadRom / pokeSlice / peekSlice / serialize / deserialize, or Machine.pokeRam / pokeRamSlice)"
            exit 1
          fi
          # Integration tests live in their own module (ADR 0014) and reach
          # `chippy_core` only via the public API. A relative `@import` that
          # walks back into `src/core/` would defeat the structural split —
          # flag any such path here. The Zig module boundary already prevents
          # symbol leakage at compile time, but the grep keeps the contract
          # legible at PR-review time and catches a path-typed bypass in one
          # line.
          if grep -rn '@import.*"\(\.\./\)\+src/core' tests/integration/; then
            echo "integration-test invariant violation: tests/integration/ must import chippy_core only via the public API, not relative paths into src/core/"
            exit 1
          fi

      - name: Build
        run: nix develop -c zig build

      - name: Test
        run: nix develop -c zig build test

      - name: Format check
        run: nix develop -c zig fmt --check src/ build.zig tests/integration/

  required:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$TEST_RESULT" == "failure" || "$TEST_RESULT" == "cancelled" ]]; then
            exit 1
          fi
          echo "ok"
